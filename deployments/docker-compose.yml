services:
  db:
    image: postgres:17-alpine
    container_name: sr_plus_db
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-supersecret}
      POSTGRES_DB: ${DB_NAME:-sr_plus}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    container_name: sr_plus_api
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      DB_URL: postgres://${DB_USER:-admin}:${DB_PASSWORD:-supersecret}@db:5432/${DB_NAME:-sr_plus}?sslmode=disable

volumes:
  postgres_data:
